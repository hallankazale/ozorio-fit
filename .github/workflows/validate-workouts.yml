name: Validar alterações de treino

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install
      - name: Testes de interface e dados
        run: npm test
      - name: TypeScript e build de produção
        run: npm run build
